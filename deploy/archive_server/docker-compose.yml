services:
  archive:
    build:
      context: ../..
      dockerfile: deploy/archive_server/Dockerfile
    image: sn21-archive:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SN21_ARCHIVE_HOST: "0.0.0.0"
      SN21_ARCHIVE_PORT: "8080"
      SN21_ARCHIVE_DIR: "/var/lib/sn21-archive"
      # Tier-2 deployments MUST keep this true. Tier-3 miner-self can set false.
      SN21_ARCHIVE_REQUIRE_SIGNED: "true"
      SN21_ARCHIVE_MAX_BODY_BYTES: "1048576"
    volumes:
      # Persist uploaded ciphertexts across restarts.
      - sn21-archive-data:/var/lib/sn21-archive
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Resource limits: AES_ct payloads are tiny; the cap is purely DoS hardening.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"

volumes:
  sn21-archive-data:
    driver: local
