services:
  - type: web
    name: sn21-validator
    runtime: python
    buildCommand: pip install -e . && chmod +x scripts/start_validator.sh
    startCommand: bash scripts/start_validator.sh
    envVars:
      # All sensitive values set in Render dashboard, not in yaml:
      # HOPE_API_KEY     — data API key
      # HOPE_API_URL     — data API base URL
      # HOTKEY_B64       — base64 encoded hotkey file
      # COLDKEYPUB_B64   — base64 encoded coldkeypub.txt
      # WALLET_NAME      — Bittensor wallet name
      # RELEASE_KEY      — Current release key
      # NETUID           — Subnet netuid
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: HOTKEY_NAME
        value: validator
      - key: BT_NETWORK
        value: test
      - key: PORT
        value: "8080"
      - key: BURN_FRACTION
        value: "0.95"
      - key: REQUIRE_SIGNATURES
        value: "true"
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
