services:
  - type: web
    name: adtao-validator
    runtime: python
    buildCommand: pip install -e .
    startCommand: hope-validator --release WR-2026-W17-PUB-E1 --port 8080 --no-chain
    envVars:
      - key: HOPE_API_KEY
        value: hope-bt-internal-2026
      - key: PYTHON_VERSION
        value: "3.12.0"
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
