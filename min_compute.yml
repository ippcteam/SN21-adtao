# Minimum compute requirements for running an SN21 miner or validator.
#
# These are guidance figures; production miners with sophisticated models
# will use more, especially for training. Validator requirements are bounded
# by orchestration + scoring, not by ML inference.

version: '1.0'

compute_spec:

  miner:

    cpu:
      min_cores: 2
      min_speed: 2.0           # GHz per core
      recommended_cores: 4
      recommended_speed: 3.0
      architecture: "x86_64"

    gpu:
      required: False  # Reference baseline runs on CPU; GPU optional for larger models.

    memory:
      min_ram: 4               # GB
      min_swap: 2
      recommended_swap: 4
      ram_type: "DDR4"

    storage:
      min_space: 5             # GB
      recommended_space: 20
      type: "SSD"
      min_iops: 500
      recommended_iops: 2000

    os:
      name: "Ubuntu"
      version: 22.04

  validator:

    cpu:
      min_cores: 4
      min_speed: 2.5
      recommended_cores: 8
      recommended_speed: 3.5
      architecture: "x86_64"

    gpu:
      required: False

    memory:
      min_ram: 8
      min_swap: 4
      recommended_swap: 8
      ram_type: "DDR4"

    storage:
      min_space: 10
      recommended_space: 50
      type: "SSD"
      min_iops: 1000
      recommended_iops: 5000

    os:
      name: "Ubuntu"
      version: 22.04

network_spec:
  bandwidth:
    download: 100              # Mbps
    upload: 20
