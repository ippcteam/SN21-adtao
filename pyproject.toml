[project]
name = "hope-sn21"
version = "0.1.0"
description = "Impact Prediction Subnet for Bittensor (SN21)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
dependencies = [
    # Pinned to 10.2.x: bittensor==10.3.1 has a regression in how
    # `Commitments::RevealedCommitments` storage queries decode — it returns
    # an empty list where 10.2.x correctly returns the auto-decrypted
    # plaintexts. Confirmed by running the same chain_reader.py path
    # against the same testnet 466 chain state on both versions:
    # 10.2.1 → 8 of 15 miners with parseable v1 bundles; 10.3.1 → 0 of 15.
    # Re-evaluate when upstream ships a fix or when our reader code is
    # updated to match the new decode contract.
    "bittensor>=10.2.0,<10.3.0",
    "pydantic>=2.0",
    "numpy>=1.24",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "httpx>=0.24",
    "cryptography>=41.0",
    "cbor2>=5.6.0",
    "prometheus-client>=0.19",
    # `bittensor_drand` (pulled in transitively by bittensor) provides the
    # general-purpose TLE primitives we need. Phase 0 Q34 confirmed the
    # `timelock` PyPI package only ships dev wheels (0.0.1.dev0) and is
    # not needed — bittensor_drand.encrypt(bytes, n_blocks) covers it.
    #
    # NOTE: `substrate-interface` is intentionally NOT a direct dep.
    # bittensor>=10 pulls in `async_substrate_interface` + `cyscale`,
    # which conflict with the older `scalecodec` namespace that
    # `substrate-interface` requires. We use `subtensor.substrate.query`
    # (which is async_substrate_interface under the hood) and
    # `bittensor_wallet.Keypair` for SS58 decoding.
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.5",
]
miner = [
    "xgboost>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    # bittensor (the SDK) and bittensor-cli (the `btcli` command) are
    # separate PyPI packages. New miners run `btcli wallet new_coldkey`
    # in Step 2 of the quickstart, so pull it in here.
    "bittensor-cli>=8.0",
]

[project.scripts]
hope-miner = "hope.miner.runner:main"
hope-validator = "hope.validator.runner:main"
hope-validator-api = "hope.validator.serve:main"
hope-archive-server = "hope.archive_server.serve:main"
hope-score = "scripts.score_predictions:main"
post-epoch-report = "scripts.post_epoch_report:main"

[tool.setuptools.packages.find]
include = ["hope*", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Integration + diagnostic scripts manipulate sys.path before importing
# the local `hope` package. The E402 rule fires on those imports; this is
# intentional, so we silence it per-file rather than scatter inline noqa.
"scripts/integration/*.py" = ["E402"]
"scripts/phase0/*.py" = ["E402"]
"scripts/verify_epoch.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
