[project]
name = "hope-sn21"
version = "0.1.0"
description = "Impact Prediction Subnet for Bittensor (SN21)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
dependencies = [
    # Requires >=10.5: a mainnet runtime upgrade (Jul 2026) changed the
    # runtime-call param encoding, so bittensor 10.2.x can no longer encode
    # `neurons_lite`/`set_weights` (ValueError in async_substrate_interface's
    # _encode_scale) — the validator silently stops setting weights. 10.5.0
    # speaks the new runtime.
    #
    # HISTORY: 10.2.x was previously pinned because 10.3.1 regressed
    # `Commitments::RevealedCommitments` decode (returned empty). 10.4+ ships
    # async-substrate-interface 2.x, which returns byte payloads as 0x-hex
    # strings (and CommitmentOf `info.fields` as list-of-dicts). `chain_reader.py`
    # now normalises BOTH the 1.x and 2.x shapes (`_scale_payload_to_bytes`),
    # so the reveal/commitment decode works again — verified end-to-end on
    # mainnet under 10.5.0 (miner bundles, reg-index, outcome anchor).
    "bittensor>=10.5.0,<11.0.0",
    "pydantic>=2.0",
    "numpy>=1.24",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "httpx>=0.24",
    "cryptography>=41.0",
    "cbor2>=5.6.0",
    "prometheus-client>=0.19",
    # `bittensor_drand` (pulled in transitively by bittensor) provides the
    # general-purpose TLE primitives we need. Phase 0 Q34 confirmed the
    # `timelock` PyPI package only ships dev wheels (0.0.1.dev0) and is
    # not needed — bittensor_drand.encrypt(bytes, n_blocks) covers it.
    #
    # NOTE: `substrate-interface` is intentionally NOT a direct dep.
    # bittensor>=10 pulls in `async_substrate_interface` + `cyscale`,
    # which conflict with the older `scalecodec` namespace that
    # `substrate-interface` requires. We use `subtensor.substrate.query`
    # (which is async_substrate_interface under the hood) and
    # `bittensor_wallet.Keypair` for SS58 decoding.
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    # PINNED, deliberately. ruff's rule set moves between releases, so an
    # unpinned linter means CI checks something different from what a
    # contributor ran locally — and a lint failure blocks the test step, so
    # the suite silently stops running. Bump this on purpose, with the fixes
    # the new version asks for, in a commit of its own.
    "ruff==0.16.1",
    "mypy>=1.5",
    # The settle-day outcomes provider reads the operator's database through
    # SQLAlchemy. The package itself is not a runtime dependency of this repo
    # — a validator only needs it if it runs that provider — but the tests
    # that cover the frozen-goal-basis logic exercise it, so it belongs here.
    # Without it those tests do not fail loudly, they simply never run.
    "sqlalchemy>=2.0",
]
miner = [
    "xgboost>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    # bittensor (the SDK) and bittensor-cli (the `btcli` command) are
    # separate PyPI packages. New miners run `btcli wallet new_coldkey`
    # in Step 2 of the quickstart, so pull it in here.
    "bittensor-cli>=8.0",
]

[project.scripts]
hope-miner = "hope.miner.runner:main"
hope-validator = "hope.validator.runner:main"
hope-validator-api = "hope.validator.serve:main"
hope-validator-heartbeat = "hope.validator.heartbeat:main"
hope-validator-daemon = "hope.validator.daemon:main"
hope-reg-index-builder = "scripts.build_reg_index:main"
hope-reg-index-refresh = "scripts.refresh_reg_index_head:main"
hope-reg-index-staleness = "scripts.check_reg_index_staleness:main"
hope-commit-outcomes = "scripts.commit_outcomes:main"
hope-verify-outcomes = "scripts.verify_outcomes:main"
hope-archive-server = "hope.archive_server.serve:main"
hope-score = "scripts.score_predictions:main"
post-epoch-report = "scripts.post_epoch_report:main"

[tool.setuptools.packages.find]
include = ["hope*", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Rules switched off deliberately, each for a reason that is about this
# codebase rather than about taste. Everything else ruff selects by default
# is enforced, and the version is pinned above so that set cannot drift.
ignore = [
    # BLE001 — blind `except Exception`. The validator, the chain readers and
    # the daily loop deliberately catch broadly at their outer boundaries: an
    # unexpected error from a chain library or a miner's container must not
    # take the validator out of consensus. The narrow catches live inside.
    "BLE001",
    # S110 / S112 — try/except/pass and try/except/continue. Same boundaries:
    # skipping an unparseable chain event or an unreachable archive is the
    # intended behaviour, not an oversight.
    "S110",
    "S112",
    # DTZ003 / DTZ011 — naive `utcnow()` / `today()`. This codebase stores and
    # compares UTC-naive datetimes throughout, including in the on-chain
    # payloads and the ledgers. Making some of them aware and not others is
    # how comparison bugs start; converting all of them is a change to the
    # data model, not a lint fix.
    "DTZ003",
    "DTZ011",
]

[tool.ruff.lint.flake8-bugbear]
# B008 fires on a call in a default argument because a MUTABLE default is
# shared between calls. Every instance here is either FastAPI's documented
# dependency-injection idiom or a frozen dataclass, so there is nothing to
# mutate and nothing to share.
extend-immutable-calls = [
    "fastapi.Depends",
    "hope.scoring.champion_promotion.PromotionParams",
    "hope.scoring.chronic_failure.ChronicFailureParams",
    "hope.scoring.participation.ParticipationParams",
    "hope.scoring.weight_curve.CurveParams",
]

[tool.ruff.lint.per-file-ignores]
# Integration + diagnostic scripts manipulate sys.path before importing
# the local `hope` package. The E402 rule fires on those imports; this is
# intentional, so we silence it per-file rather than scatter inline noqa.
"scripts/integration/*.py" = ["E402"]
"scripts/phase0/*.py" = ["E402"]

# TRY004 wants TypeError when a value is of the wrong type. These three raise
# on CBOR that was decoded from CHAIN BYTES: a payload that decodes to
# something other than a map is malformed input, not a caller passing the
# wrong argument. ValueError is the honest signal, and it is what the
# verifier's callers already catch.
"scripts/verify_epoch.py" = ["E402", "TRY004"]
"hope/commitment/episode_artifacts.py" = ["TRY004"]
"hope/commitment/prediction_payload.py" = ["TRY004"]

# ASYNC230 warns that a blocking open() stalls the event loop. This is a
# single-shot CLI that awaits one fetch and then writes its output files;
# nothing else is scheduled on the loop for it to stall.
"scripts/generate_training_data.py" = ["ASYNC230"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
