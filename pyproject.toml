[project]
name = "hope-sn21"
version = "0.1.0"
description = "HOPE Impact Prediction Subnet for Bittensor (SN21)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
dependencies = [
    "bittensor>=8.0.0",
    "pydantic>=2.0",
    "numpy>=1.24",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "httpx>=0.24",
    "substrate-interface>=1.7",
    "cryptography>=41.0",
    "cbor2>=5.6.0",
    "timelock>=0.0.3",
    "prometheus-client>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.5",
]
miner = [
    "xgboost>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.scripts]
hope-miner = "hope.miner.runner:main"
hope-validator = "hope.validator.runner:main"
hope-score = "scripts.score_predictions:main"

[tool.setuptools.packages.find]
include = ["hope*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
